<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Message For Dineo ❤️ GODMODE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;
background:linear-gradient(-45deg,#020617,#0f172a,#4c1d95,#06b6d4,#ec4899);
background-size:500% 500%;
animation:bg 18s ease infinite;
color:#fff;
}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
body:before{
content:"";position:fixed;inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(255,0,255,.25),transparent 35%),
radial-gradient(circle at 80% 30%,rgba(0,255,255,.2),transparent 35%),
radial-gradient(circle at 50% 80%,rgba(0,255,120,.2),transparent 35%);
animation:aurora 15s linear infinite;
}
@keyframes aurora{to{transform:rotate(360deg) scale(1.2)}}
.container{position:relative;z-index:5;text-align:center}
.open-btn{
padding:18px 40px;border-radius:50px;border:1px solid rgba(255,255,255,.2);
background:rgba(255,255,255,.08);backdrop-filter:blur(20px);
color:white;font-size:1.2rem;cursor:pointer;
box-shadow:0 0 30px rgba(0,255,255,.4);
animation:glow 3s infinite;
}
@keyframes glow{50%{box-shadow:0 0 70px rgba(0,255,255,.9),0 0 120px rgba(255,0,255,.4)}}
.card{
display:none;width:min(90vw,700px);
padding:35px;border-radius:35px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 30px 100px rgba(0,0,0,.45);
transform-style:preserve-3d;
position:relative;overflow:hidden;
}
.card.show{display:block;animation:portal 1.8s ease forwards}
@keyframes portal{
0%{opacity:0;transform:perspective(1500px) rotateX(80deg) rotateY(-60deg) scale(.2)}
100%{opacity:1;transform:perspective(1500px) rotateX(0) rotateY(0) scale(1)}
}
.card:before{
content:"";position:absolute;inset:-200%;
background:linear-gradient(115deg,transparent,rgba(255,255,255,.25),transparent);
animation:sweep 6s linear infinite;
}
@keyframes sweep{from{transform:translateX(-100%) rotate(25deg)}to{transform:translateX(200%) rotate(25deg)}}
h1{margin-bottom:20px}
p{line-height:1.8}
.signature{margin-top:20px;font-size:1.2rem;font-weight:bold}
.orb,.heart{position:absolute;pointer-events:none}
.orb{border-radius:50%;filter:blur(20px);animation:float 10s infinite alternate}
@keyframes float{to{transform:translateY(-120px) scale(1.3)}}
.heart{animation:heart 8s linear forwards;text-shadow:0 0 15px #ff0080}
@keyframes heart{
from{transform:translateY(100vh) rotateY(0deg)}
to{transform:translateY(-120vh) rotateY(720deg)}
}
</style>
</head>
<body>
<div class="container">
<button id="openBtn" class="open-btn">💌 Open Message</button>
<div class="card" id="card">
<h1 id="greeting"></h1>
<p id="message"></p>
<div class="signature">With Love,<br>Lusanda ❤️</div>
</div>
</div>

<audio id="bgMusic" loop></audio>

<script>
const hour=new Date().getHours();
const greeting=document.getElementById('greeting');
const message=document.getElementById('message');

if(hour<12){
greeting.innerHTML="🌞 Good Morning";
message.innerHTML="May your day be filled with peace, joy and countless reasons to smile. Even when we are apart, you are never far from my thoughts.";
}else if(hour<18){
greeting.innerHTML="☀️ Hello Luv";
message.innerHTML="You bring comfort and warmth into my life. Thank you for being someone I can think of when I need strength and hope.";
}else{
greeting.innerHTML="🌙 Good Evening Hun";
message.innerHTML="As the stars shine tonight, remember that you are appreciated more than words can express. Rest well beautiful soul ❤️";
}

for(let i=0;i<15;i++){
let orb=document.createElement('div');
orb.className='orb';
let s=100+Math.random()*150;
orb.style.width=s+'px';
orb.style.height=s+'px';
orb.style.left=Math.random()*100+'vw';
orb.style.top=Math.random()*100+'vh';
orb.style.background=`hsla(${Math.random()*360},100%,60%,.15)`;
document.body.appendChild(orb);
}

openBtn.onclick=()=>{
openBtn.style.display='none';
card.classList.add('show');
bgMusic.play().catch(()=>{});
}

setInterval(()=>{
let h=document.createElement('div');
h.className='heart';
h.innerHTML=['❤️','💖','💕','💗'][Math.floor(Math.random()*4)];
h.style.left=Math.random()*100+'vw';
h.style.fontSize=(20+Math.random()*40)+'px';
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},400);

document.addEventListener('mousemove',e=>{
if(!card.classList.contains('show')) return;
const x=(window.innerWidth/2-e.clientX)/35;
const y=(window.innerHeight/2-e.clientY)/35;
card.style.transform=`perspective(1500px) rotateY(${-x}deg) rotateX(${y}deg)`;
});
</script>
</body>
</html>
