<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message For Dineo ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    transition:1s;
}

/* MORNING */
.morning{
    background:linear-gradient(135deg,#87CEEB,#FFFACD);
}

/* DAY */
.day{
    background:linear-gradient(135deg,#00BFFF,#ffffff);
}

/* EVENING */
.evening{
    background:linear-gradient(135deg,#0f172a,#4c1d95,#ff6b81);
}

.container{
    text-align:center;
    z-index:10;
}

.open-btn{
    padding:18px 40px;
    border:none;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    background:white;
    color:#333;
    font-weight:bold;
    box-shadow:0 0 20px rgba(255,255,255,.5);
    transition:.4s;
}

.open-btn:hover{
    transform:scale(1.1);
}

.card{
    display:none;
    width:90%;
    max-width:600px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    padding:30px;
    border-radius:25px;
    color:white;
    animation:openCard 1.5s ease;
}

@keyframes openCard{
    from{
        transform:scale(.2) rotateY(90deg);
        opacity:0;
    }
    to{
        transform:scale(1) rotateY(0);
        opacity:1;
    }
}

.card h1{
    margin-bottom:15px;
}

.card p{
    line-height:1.8;
    font-size:18px;
}

.signature{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

/* FLOATING HEARTS */
.heart{
    position:absolute;
    font-size:25px;
    animation:float 8s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(100vh);
        opacity:1;
    }
    100%{
        transform:translateY(-100px);
        opacity:0;
    }
}

/* MORNING SUN */
.sun{
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#FFD700;
    top:50px;
    right:50px;
    box-shadow:0 0 60px #FFD700;
    animation:pulse 3s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.1);
    }
}

/* DAY CLOUDS */
.cloud{
    position:absolute;
    color:white;
    font-size:80px;
    animation:cloudMove 25s linear infinite;
}

@keyframes cloudMove{
    from{
        transform:translateX(-200px);
    }
    to{
        transform:translateX(120vw);
    }
}

/* EVENING STARS */
.star{
    position:absolute;
    color:white;
    animation:twinkle 2s infinite;
}

@keyframes twinkle{
    50%{
        opacity:.2;
    }
}
</style>
</head>

<body>

<div class="container">

<button class="open-btn" id="openBtn">
💌 Open Message
</button>

<div class="card" id="card">
<h1 id="greeting"></h1>

<p id="message"></p>

<div class="signature">
With love,<br>
Lusanda ❤️
</div>

</div>
</div>

<audio id="bgMusic" loop></audio>

<script>
const message = document.getElementById("message");

const hour = new Date().getHours();

const greeting = document.getElementById("greeting");
const body = document.body;
const music = document.getElementById("bgMusic");

if(hour >= 5 && hour < 12){

    body.classList.add("morning");
    greeting.innerHTML = "🌞 Good Morning Dineo";

    music.src = "Kanye West - Good Morning.mp3";

    message.innerHTML = `
    Dineo ❤️<br><br>

    As you begin this beautiful morning, I hope you wake up knowing how much you are cared for.
    Even when we are apart, you cross my mind more often than you realize.

    May today bring you peace, strength and countless reasons to smile.
    Never forget that there is someone who deeply appreciates the wonderful person that you are.

    Have a beautiful day ahead and keep shining your light.
    `;

    let sun=document.createElement("div");
    sun.classList.add("sun");
    body.appendChild(sun);

}
else if(hour >= 12 && hour < 18){

    body.classList.add("day");
    greeting.innerHTML = "☀️ Good Afternoon Dineo";

    music.src = "ratolaka.mp3";

    message.innerHTML = `
    Dineo ❤️<br><br>

    I hope your day has been going well so far.
    Amid all the things that may be demanding your attention today, I just wanted to remind you that you are valued and appreciated.

    Even when I am not always around, my care for you never fades.
    You remain someone special to me, and I often find myself thinking about you.

    May the rest of your day be filled with success, happiness and beautiful moments.
    `;

    for(let i=0;i<5;i++){
        let cloud=document.createElement("div");
        cloud.innerHTML="☁️";
        cloud.classList.add("cloud");
        cloud.style.top=Math.random()*80+"%";
        cloud.style.animationDelay=Math.random()*10+"s";
        body.appendChild(cloud);
    }

}
else{

    body.classList.add("evening");
    greeting.innerHTML = "🌙 Good Evening Dineo ❤️";

    music.src = "rumgold.mpeg";

    message.innerHTML = `
    Dineo ❤️<br><br>

    As the day comes to an end, I hope you find a moment to relax and reflect on how far you've come.

    Even though I may not always be there beside you, please know that I care about you deeply.
    You are often in my thoughts, and I genuinely wish the very best for you.

    Tonight, may your heart be at peace, your mind be calm and your dreams be beautiful.
    Rest well knowing that you are appreciated more than words can express.

    Goodnight, beautiful soul ❤️
    `;

    for(let i=0;i<80;i++){
        let star=document.createElement("div");
        star.innerHTML="✦";
        star.classList.add("star");
        star.style.left=Math.random()*100+"%";
        star.style.top=Math.random()*100+"%";
        star.style.animationDelay=Math.random()*3+"s";
        body.appendChild(star);
    }
}

document.getElementById("openBtn").addEventListener("click",()=>{

    document.getElementById("openBtn").style.display="none";

    document.getElementById("card").style.display="block";

    music.play();

});

/* HEARTS */

setInterval(()=>{

    let heart=document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML=["❤️","💖","💕","💗"][Math.floor(Math.random()*4)];

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(20+Math.random()*30)+"px";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);

},500);

</script>

</body>
</html>
